[package]
name = "tagma-proto"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "tagma's Tag as a protobuf message (proto/tagma/v1/tag.proto), with conversions to and from tagma-core's Tag"

# prost only, and tagma-core for the conversions: a consumer's own messages
# embed this one, so it must pull in nothing of theirs. prost is 0.14, the
# version its first consumer (ctxloom, through angzarr-proto) generates for:
# messages from two prost versions cannot be nested in one another.
[dependencies]
prost = "0.14"
tagma-core = { version = "0.1.0", path = "../tagma-core" }

# Generated into OUT_DIR at build time, never committed. Needs protoc on
# PATH (or PROTOC).
[build-dependencies]
prost-build = "0.14"
