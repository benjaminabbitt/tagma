[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "tagma"
version = "0.1.0"
description = "Python bindings for tagma (PyO3, wraps tagma-core directly)"
requires-python = ">=3.10"
license = "Apache-2.0 OR BSD-3-Clause"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
module-name = "tagma"
features = ["pyo3/extension-module"]

# ruff is dev-only (installed by `just setup-py`, run by `just lint-py`). Its
# default lint set (pycodestyle E4/E7/E9, pyflakes F) plus the stack's
# complexity gate: mccabe complexity over 10, and pylint's branch, statement
# and argument counts at ruff's defaults (12, 50 and 5). No noqa or per-file
# escapes; a violator is refactored.
[tool.ruff]
extend-exclude = [".venv"]

[tool.ruff.lint]
extend-select = ["C901", "PLR0912", "PLR0915", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10
