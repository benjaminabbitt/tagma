name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # tagma-proto generates its prost types at build time.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup
        run: just setup

      - name: Check
        run: just check

  # The JS binding: wasm-pack builds tagma-core to wasm, then the node:test
  # smoke tests and cucumber-js conformance run against it. Its own job so
  # `just check` stays toolchain-light (no node, no wasm toolchain).
  conformance-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Node pinned to the devcontainer's version (.devcontainer/devcontainer.json).
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup JS
        run: just setup-js

      - name: Conformance (JS)
        run: just conformance-js
