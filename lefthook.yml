# Git hooks, managed by lefthook (`just hooks-install`).
# https://github.com/evilmartians/lefthook
#
# A failing hook is a finding: fix the cause and commit again; never bypass
# it with --no-verify.
#
# Red tests are allowed on branches and never merged red: a commit off the
# default branch may carry failing tests (`just test-commit`, warned), a
# commit or merge commit on it may not, and a push to it is refused unless
# the pushed commit's tests pass (`just push-check`). After a hook is added
# here, `just hooks-install` again (pre-merge-commit and pre-push were).

pre-commit:
  parallel: false
  commands:
    fmt:
      # Formats the Rust rather than refusing it, and restages what it fixed.
      glob: "*.rs"
      run: just fmt
      stage_fixed: true
    lint:
      run: just lint
    lint-wasm:
      glob: "crates/tagma-wasm/**"
      run: just lint-wasm
    lint-py:
      glob: "bindings/python/**"
      run: just lint-py
    # Red tests are committed off the default branch and refused on it; a
    # build failure is refused everywhere (`just test-commit`).
    test:
      run: just test-commit

# A merge commit is tested as a commit is: one bringing red tests onto the
# default branch is refused, one onto another branch is warned.
pre-merge-commit:
  commands:
    test:
      run: just test-commit

# Red tests never reach the default branch: `just push-check` runs every test
# in each pushed commit's own tree (the justfile says how), refusing a push
# to the default branch whose tests fail and warning on any other branch.
# git's pushed refs are on stdin, and {1} is the remote's name. lefthook
# skips a pre-push command when it finds no files changed between HEAD and
# the remote, which says nothing of the refs pushed; a `{files}` in `run`
# turns that off, so `files` names one that is always there, and push-check
# ignores it. No mutation testing in any hook.
pre-push:
  commands:
    push-check:
      use_stdin: true
      files: echo justfile
      run: just push-check {1} {files}
